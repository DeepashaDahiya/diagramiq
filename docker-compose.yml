version: '3.8'

services:
  diagramiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diagramiq-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TAGS_URL=http://ollama:11434/api/tags
    volumes:
      - diagramiq_data:/app/data/diagrams
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - diagramiq-net

  ollama:
    image: ollama/ollama:latest
    container_name: diagramiq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - diagramiq-net

volumes:
  diagramiq_data:
  ollama_models:

networks:
  diagramiq-net:
    driver: bridge
